<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starizo - Rice-Derived Ingredients for Global Markets</title>
  <!-- SEO Meta Tags -->
  <meta name="description"
    content="GMO-free rice ingredients with transparent labeling, manufactured for quality, sustainability, and flexible usage across industries. Starches, sweeteners, proteins, and dietary fibres.">
  <link rel="stylesheet" href="./src/style.css">
</head>

<body class="font-montserrat bg-[#FDFBF3] text-black min-h-screen antialiased overflow-x-hidden">

  <!-- ========================================== -->
  <!-- ========== DESKTOP LAYOUT VIEW ========== -->
  <!-- ========================================== -->
  <div class="hidden xl:block w-full">

    <!-- ========== HERO SECTION ========== -->
    <section class="relative w-full h-[860px] bg-[#FBEAC4] overflow-hidden">

      <!-- ===================================================== -->
      <!-- LAYER 1 : BACKGROUND -->
      <!-- ===================================================== -->

      <!-- Cream background -->
      <div class="absolute inset-0 bg-[#FBEAC4] z-0"></div>

      <!-- Green top area -->
      <div class="absolute top-0 left-0 w-full h-[620px]
               bg-gradient-to-br from-[#00A256] to-[#39C56C]
               z-[1]">
      </div>

      <!-- ===================================================== -->
      <!-- LAYER 2 : DECORATIVE BACKGROUND -->
      <!-- ===================================================== -->

      <!-- Left Looper -->
      <img src="./public/assets/Looper-1.png" alt="" class="absolute
               left-0
               top-0
               h-[620px]
               w-auto
               object-contain
               object-left-top
               pointer-events-none
               z-[2]" />

      <!-- Right decorative group -->
      <img src="./public/assets/group.png" alt="" class="absolute
               right-0
               top-0
               h-[620px]
               w-auto
               object-contain
               object-right-top
               pointer-events-none
               z-[2]" />



      <!-- ===================================================== -->
      <!-- LAYER 3 : PRODUCT IMAGE -->
      <!-- ===================================================== -->

      <div class="absolute
           bottom-[-5px]
           right-[-60px]
           w-[980px]
           h-[650px]
           z-[3]
           pointer-events-none">

        <img src="./public/assets/home-hero-rice.png" class="w-full h-full object-contain object-bottom-center">
      </div>



      <!-- ===================================================== -->
      <!-- LAYER 4 : CONTENT -->
      <!-- ===================================================== -->

      <div class="relative
               z-[10]
               w-[1280px]
               h-full
               mx-auto">

        <!-- ================= NAVBAR ================= -->

        <header class="absolute top-[23px] left-[40px] right-[40px]">

          <div class="h-[85px]
                       bg-white
                       rounded-[26px]
                       shadow-[0_4px_44px_rgba(0,0,0,0.05)]
                       border
                       border-gray-100
                       px-10
                       flex
                       items-center
                       justify-between">

            <!-- Logo -->
            <a href="/">
              <img src="./public/assets/logo.svg" class="h-9" alt="">
            </a>

            <!-- Menu -->

            <nav class="flex items-center gap-10">

              <button class="flex items-center gap-1 text-[18px] font-medium text-starizo-brown">

                Products

                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">

                  <path d="M7 10l5 5 5-5H7z" />

                </svg>

              </button>

              <a href="./about.html" class="text-[18px] font-medium hover:text-starizo-orange transition">About</a>

              <a href="#" class="text-[18px] font-medium">
                Partner with Us
              </a>

              <a href="#" class="text-[18px] font-medium">
                Research Lab
              </a>

              <a href="#" class="text-[18px] font-medium">
                Careers
              </a>

              <a href="#" class="text-[18px] font-medium">
                Insights
              </a>

            </nav>

            <!-- Contact -->

            <a href="#" class="bg-[#FF9100]
                           text-white
                           px-7
                           h-[46px]
                           rounded-full
                           flex
                           items-center
                           gap-2
                           font-bold">

              Contact Us

              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2">

                <polyline points="9 18 15 12 9 6" />

              </svg>

            </a>

          </div>

        </header>
